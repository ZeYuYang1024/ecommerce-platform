server:
  port: 8095

spring:
  application:
    name: ecommerce-knowledge
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_knowledge?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      max-active: 20
      min-idle: 5
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

langchain4j:
  open-ai:
    chat-model:
      api-key: ${DEEPSEEK_API_KEY:your-api-key-here}
      base-url: https://api.deepseek.com
      model-name: deepseek-chat
      temperature: 0.2
      max-tokens: 512
  ollama:
    embedding-model:
      base-url: http://localhost:11434
      model-name: bge-m3
  milvus:
    host: localhost
    port: 19530
    collection-name: kb_documents

knowledge:
  chat:
    fast-path-enabled: true
    tool-only-agent-enabled: true
    streaming-enabled: true
    structured-query-timeout-ms: 1500

management:
  endpoints:
    web:
      exposure:
        include: "*"

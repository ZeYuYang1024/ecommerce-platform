# MySQL 8.0 and Redis 7.2 are running natively (not in Docker)
# To start middleware:  docker-compose up -d

services:
  nacos:
    image: nacos/nacos-server:v2.4.0
    container_name: ecommerce-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
    volumes:
      - nacos-data:/home/nacos/data

  rocketmq-namesrv:
    image: apache/rocketmq:5.2.0
    container_name: ecommerce-rmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    volumes:
      - rocketmq-namesrv-data:/home/rocketmq/logs

  rocketmq-broker:
    image: apache/rocketmq:5.2.0
    container_name: ecommerce-rmq-broker
    restart: unless-stopped
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    command: sh mqbroker -n rocketmq-namesrv:9876
    depends_on:
      - rocketmq-namesrv
    volumes:
      - rocketmq-broker-data:/home/rocketmq/logs

  minio:
    image: minio/minio:latest
    container_name: ecommerce-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

volumes:
  nacos-data:
  rocketmq-namesrv-data:
  rocketmq-broker-data:
  minio-data:

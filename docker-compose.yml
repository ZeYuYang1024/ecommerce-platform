# Start all middleware:  docker-compose up -d
# Start specific:  docker-compose up -d mysql redis

services:
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.2
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass root
    volumes:
      - redis-data:/data

  nacos:
    image: nacos/nacos-server:v2.4.0
    container_name: ecommerce-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
    volumes:
      - nacos-data:/home/nacos/data

  rocketmq-namesrv:
    image: apache/rocketmq:5.2.0
    container_name: ecommerce-rmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    volumes:
      - rocketmq-namesrv-data:/home/rocketmq/logs

  rocketmq-broker:
    image: apache/rocketmq:5.2.0
    container_name: ecommerce-rmq-broker
    restart: unless-stopped
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    depends_on:
      - rocketmq-namesrv
    volumes:
      - rocketmq-broker-data:/home/rocketmq/logs
      - ./docker/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf

  minio:
    image: minio/minio:latest
    container_name: ecommerce-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  elasticsearch:
    image: elasticsearch:7.17.28
    container_name: ecommerce-es
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "false"
    volumes:
      - es-data:/usr/share/elasticsearch/data

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  rocketmq-namesrv-data:
  rocketmq-broker-data:
  minio-data:
  es-data:

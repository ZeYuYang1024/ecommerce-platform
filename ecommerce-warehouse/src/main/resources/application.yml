# ecommerce-warehouse/src/main/resources/application.yml
server:
  port: 8097
spring:
  application:
    name: ecommerce-warehouse
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_warehouse?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      max-active: 20
      min-idle: 5
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      filter:
        stat:
          enabled: true
        wall:
          enabled: true
      stat-view-servlet:
        enabled: true
        login-username: admin
        login-password: admin
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
rocketmq:
  name-server: localhost:9876
  producer:
    group: ${spring.application.name}-producer
outbox:
  enabled: true
  publisher:
    fixed-delay-ms: 5000
    batch-size: 50

warehouse:
  provider:
    active: stub

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: ALWAYS

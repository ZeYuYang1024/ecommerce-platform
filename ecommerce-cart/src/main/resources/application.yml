server:
  port: 8086
spring:
  application:
    name: ecommerce-cart
  data:
    redis:
      host: localhost
      port: 6379
      password: root
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: ecommerce-cart-recommendation

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: ALWAYS

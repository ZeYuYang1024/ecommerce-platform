server:
  port: 8080

spring:
  application:
    name: ecommerce-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: lb://ecommerce-auth
              predicates:
                - Path=/api/v1/auth/**,/api/v1/admin/users
            - id: file
              uri: lb://ecommerce-file
              predicates:
                - Path=/api/v1/files/**
            - id: user
              uri: lb://ecommerce-user
              predicates:
                - Path=/api/v1/users/**,/api/v1/admin/users
            - id: product
              uri: lb://ecommerce-product
              predicates:
                - Path=/api/v1/products/**,/api/v1/categories/**,/api/v1/reviews/**,/api/v1/admin/products/**,/api/v1/admin/categories/**
            - id: inventory
              uri: lb://ecommerce-inventory
              predicates:
                - Path=/api/v1/inventory/**,/api/v1/admin/inventory/**
            - id: merchant
              uri: lb://ecommerce-merchant
              predicates:
                - Path=/api/v1/merchants/**,/api/v1/admin/merchants/**
            - id: cart
              uri: lb://ecommerce-cart
              predicates:
                - Path=/api/v1/cart/**
            - id: order
              uri: lb://ecommerce-order
              predicates:
                - Path=/api/v1/orders/**,/api/v1/admin/orders/**
            - id: payment
              uri: lb://ecommerce-payment
              predicates:
                - Path=/api/v1/payment/**,/api/v1/admin/payment/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

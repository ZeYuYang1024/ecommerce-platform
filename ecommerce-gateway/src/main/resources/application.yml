server:
  port: 8080

spring:
  application:
    name: ecommerce-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: lb://ecommerce-auth
              predicates:
                - Path=/api/v1/auth/**,/api/v1/admin/dashboard/**,/api/v1/admin/users,/api/v1/admin/merchant-account,/api/v1/admin/roles/**,/api/v1/admin/permissions/**,/api/v1/admin/admin-users,/api/v1/admin/users/*/roles
            - id: file
              uri: lb://ecommerce-file
              predicates:
                - Path=/api/v1/files/**
            - id: user
              uri: lb://ecommerce-user
              predicates:
                - Path=/api/v1/users/**
            - id: product
              uri: lb://ecommerce-product
              predicates:
                - Path=/api/v1/products/**,/api/v1/categories/**,/api/v1/reviews/**,/api/v1/admin/products/**,/api/v1/admin/merchant/products/**,/api/v1/admin/categories/**,/api/v1/admin/brands/**,/api/v1/admin/merchant/brands/**,/api/v1/admin/reviews/**,/api/v1/admin/merchant/reviews/**,/api/v1/internal/spu-ids
            - id: inventory
              uri: lb://ecommerce-inventory
              predicates:
                - Path=/api/v1/inventory/**
            - id: merchant
              uri: lb://ecommerce-merchant
              predicates:
                - Path=/api/v1/merchants/**,/api/v1/admin/merchants/**
            - id: cart
              uri: lb://ecommerce-cart
              predicates:
                - Path=/api/v1/cart/**
            - id: order
              uri: lb://ecommerce-order
              predicates:
                - Path=/api/v1/orders/**,/api/v1/internal/orders/**,/api/v1/orders/no/**,/api/v1/admin/orders/**,/api/v1/admin/merchant/orders/**
            - id: payment
              uri: lb://ecommerce-payment
              predicates:
                - Path=/api/v1/payment/**,/api/v1/admin/payment/**,/api/v1/admin/merchant/payment/**,/api/v1/admin/reconciliation/**,/api/v1/admin/merchant/reconciliation/**,/api/v1/admin/settlements/**,/api/v1/admin/merchant/settlement/**
            - id: search
              uri: lb://ecommerce-search
              predicates:
                - Path=/api/v1/search/**,/api/v1/admin/search/**
            - id: coupon
              uri: lb://ecommerce-coupon
              predicates:
                - Path=/api/v1/coupons/**,/api/v1/admin/coupons/**
            - id: notification
              uri: lb://ecommerce-notification
              predicates:
                - Path=/api/v1/notifications/**,/api/v1/admin/notification/**
            - id: seckill
              uri: lb://ecommerce-seckill
              predicates:
                - Path=/api/v1/seckill/**,/api/v1/admin/seckill/**
            - id: knowledge
              uri: lb://ecommerce-knowledge
              predicates:
                - Path=/api/v1/knowledge/**,/api/v1/admin/knowledge/**,/api/v1/admin/merchant/knowledge/**
            - id: monitor
              uri: lb://ecommerce-monitor
              predicates:
                - Path=/admin/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: ALWAYS

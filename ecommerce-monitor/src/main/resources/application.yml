server:
  port: 8094

spring:
  application:
    name: ecommerce-monitor
  boot:
    admin:
      context-path: /admin
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: ALWAYS
